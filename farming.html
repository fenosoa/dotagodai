<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Path viewer</title>
    <style>
      body {
        margin: 0;
        background: #111;
        color: #eee;
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      h1 {
        margin-top: 8px;                                                                                                  
        margin-bottom: 4px;
        font-size: 20px;
      }

      #controls {
        margin-top: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      canvas {
        display: block;
        border: 1px solid #444;
        image-rendering: crisp-edges;
      }

      #canvasWrapper {
        position: relative;
        display: inline-block;
      }

      #dropOverlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 16px;
        background: rgba(0, 0, 0, 0.6);
        border: 2px dashed #666;
        color: #ccc;
        font-size: 16px;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s, color 0.15s;
      }

      #dropOverlay span {
        display: block;
        margin-top: 4px;
        font-size: 13px;
        color: #999;
      }

      #dropOverlay.drag-over {
        background: rgba(0, 255, 153, 0.15);
        border-color: #00ff99;
        color: #fff;
      }

      #dropOverlay.hidden {
        display: none;
      }

      #statusOverlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 16px;
        background: rgba(0, 0, 0, 0.75);
        color: #eee;
        font-size: 16px;
      }

      #statusOverlay.hidden {
        display: none;
      }

      .spinner {
        width: 24px;
        height: 24px;
        margin: 0 auto 10px;
        border: 3px solid #444;
        border-top-color: #00ff99;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #playerPicker {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        background: rgba(17, 17, 17, 0.95);
        padding: 16px;
        overflow-y: auto;
      }

      #playerPicker.hidden {
        display: none;
      }

      #playerPickerHeader {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 10px;
        text-align: center;
      }

      #playerList {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .player-card {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        background: #1c1c1c;
        border: 1px solid #444;
        border-left: 4px solid #888;
        border-radius: 4px;
        cursor: pointer;
        text-align: left;
        color: #eee;
        font-size: 13px;
      }

      .player-card:hover {
        background: #2a2a2a;
        border-color: #666;
      }

      .player-card.radiant {
        border-left-color: #66bb6a;
      }

      .player-card.dire {
        border-left-color: #ef5350;
      }

      .player-card .player-hero {
        font-weight: 600;
      }

      .player-card .player-name {
        color: #999;
        font-size: 12px;
      }

      #stats {
        margin-top: 4px;
        font-size: 16px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        text-align: left;
        gap: 2px;
      }

      /* LH très visible */
      #stats .lh-highlight {
        font-size: 32px;
        font-weight: 700;
        color: #ffeb3b; /* valeur par défaut, override en inline pour vert/bleu */
        text-shadow: 0 0 8px rgba(0, 0, 0, 0.9);
        letter-spacing: 1px;
      }

      #stats .gold-total {
        margin-top: 2px;
        font-size: 20px;
      }

      /* Une donnée = une ligne, labels à gauche, % à droite */
      #stats .gold-row {
        display: flex;
        justify-content: space-between;
        width: 260px; /* ajustez si nécessaire */
        font-size: 18px;
      }

      #stats .gold-label {
        font-weight: 500;
      }

      #stats .gold-value {
        font-variant-numeric: tabular-nums;
      }

      button {
        cursor: pointer;
        padding: 4px 8px;
        background: #333;
        color: #eee;
        border: 1px solid #555;
        border-radius: 4px;
      }

      .speed-label {
        padding: 4px 12px;
        background: #222;
        border: 1px solid #444;
        border-radius: 4px;
        font-weight: bold;
        min-width: 40px;
        text-align: center;
      }

      #backToPickerBtn.hidden {
        display: none;
      }
    </style>
  </head>

  <body>
    <h1 id="titleHeader">Path viewer</h1>

    <div id="canvasWrapper">
      <canvas id="mapCanvas"></canvas>
      <div id="dropOverlay">
        <div>
          Glissez-déposez un replay .dem ou un fichier .json ici
          <span>ou cliquez pour parcourir</span>
        </div>
      </div>
      <div id="statusOverlay" class="hidden">
        <div>
          <div class="spinner"></div>
          <div id="statusText">Chargement...</div>
        </div>
      </div>
      <div id="playerPicker" class="hidden">
        <div id="playerPickerHeader">Choisissez un joueur</div>
        <div id="playerList"></div>
      </div>
    </div>

    <input type="file" id="fileInput" accept="application/json,.json,.dem" aria-label="Choisir un fichier JSON ou un replay .dem" hidden />

    <div id="controls">
      <button id="backToPickerBtn" class="hidden">Choix du joueur</button>
      <button id="playPauseBtn">Play</button>

      <input id="timeSlider" type="range" min="0" max="1" step="0.001" value="0" />

      <span id="timeLabel">00:00</span>

      <button id="speedMinusBtn">−</button>
      <span id="speedBtn" class="speed-label">1x</span>
      <button id="speedPlusBtn">+</button>
    </div>

    <div id="stats"></div>

    <script src="viewer.js"></script>
  </body>
</html>
